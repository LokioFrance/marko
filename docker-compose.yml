services:

  marko:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: marko
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - marko_db:/app/data
      - marko_media:/app/media
    ports:
      - "${HOST_PORT:-8003}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/identifiers/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  marko-mcp:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: marko-mcp
    restart: unless-stopped
    environment:
      MARKO_API_URL: "http://marko:8000"
      MCP_PORT: "${MCP_PORT:-9000}"
      MCP_API_KEY: "${MCP_API_KEY:-}"
      HONEYPOT_API_KEY: "${HONEYPOT_API_KEY:-}"
    ports:
      - "${MCP_HOST_PORT:-9005}:9000"
    depends_on:
      marko:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:9000/sse').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  marko_db:
  marko_media:
